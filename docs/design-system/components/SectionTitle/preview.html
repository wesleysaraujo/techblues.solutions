<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap">
<style>

  .block { padding:24px; border-radius:var(--raio-md); }
  .light { background:var(--branco); text-align:left; }

  .dark { background:var(--azul-techblues); text-align:center; }
  .eyebrow { display:block; margin:0 0 4px; }
  .title { margin:0; }
</style>
<div class="wrap">

    <p class="eyebrow eyebrow" style="color:var(--azul-techblues)">TECH BLOG</p>

  </div>
  <div class="block center">
    <p class="eyebrow eyebrow" style="color:var(--azul-techblues)">TECH BLOG</p>
    <h2 class="title titulo-h2" style="color:var(--cinza-escuro-techblues)">Fique por dentro das novidades do Universo Tech</h2>
  </div>
  <div class="block dark">
    <p class="eyebrow eyebrow" style="color:var(--branco)">TECH BLOG</p>

  </div>
