<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;800&display=swap">
<style>
  .wrap { padding:24px; font-family: var(--font-corpo); background:var(--cinza-eaeaea); border-radius:8px; }
  .field { display:flex; width:420px; max-width:100%; height:37px; border-radius:var(--raio-md); border:1px solid var(--azul-claro-destaque); overflow:hidden; background:var(--cinza-claro-techblues); }
  .input { flex:1; border:none; background:transparent; padding:0 14px; font-size:12px; color:var(--cinza-escuro-techblues); }
  .submit { width:150px; background:var(--azul-claro-destaque); color:var(--branco); border:none; font-size:12px; }
</style>
<div class="wrap">
  <div class="field">
    <input class="input form-placeholder" placeholder="Seu melhor e-mail">
    <button class="submit rotulo-botao">ENVIAR</button>
  </div>
</div>
