<!-- @dsCard group="Conteúdo" height=280 subtitle="Cartão de post do blog" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<style>
  .wrap { padding:20px; font-family: var(--font-corpo); }
  .card { width:280px; border-radius:var(--raio-md); overflow:hidden; border:0.5px solid #9747FF33; background:var(--branco); }
  .img { height:160px; background:linear-gradient(135deg, var(--azul-techblues), var(--azul-profundo)); }
  .body { padding:16px; }
  .title { color:var(--azul-techblues); font-size:14px; font-weight:700; margin:0 0 6px; }
  .excerpt { color:var(--cinza-escuro-techblues); font-size:12px; line-height:1.5; margin:0; }
</style>
<div class="wrap">
  <div class="card">
    <div class="img"></div>
    <div class="body">
      <p class="title">Lorem ipsum dolor sit amet, sed do eiusmod tempor.</p>
      <p class="excerpt texto-reduzido">Um resumo curto do artigo do blog aparece aqui, em até duas ou três linhas de texto auxiliar.</p>
    </div>
  </div>
</div>
