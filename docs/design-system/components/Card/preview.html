<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Open+Sans:wght@400;700&display=swap">
<style>
  .wrap { display:flex; gap:16px; padding:20px; font-family: var(--font-corpo); flex-wrap:wrap; }
  .card { width:220px; border-radius:var(--raio-md); padding:20px; box-sizing:border-box; }
  .card-padrao { background:#F0F4F9; border:0.5px solid var(--azul-techblues); color:var(--cinza-escuro-techblues); }
  .card-azul { background:var(--azul-techblues); color:var(--branco); border:0.5px solid var(--azul-techblues); }
  .card-laranja { background:var(--laranja); color:var(--cinza-max); border:0.5px solid var(--azul-techblues); }
  .card h4 { margin:0 0 8px; font-size:16px; }
  .card p { margin:0; font-size:14px; line-height:1.4; }
</style>
<div class="wrap">
  <div class="card card-padrao">
    <h4 class="titulo-h4">Automação de processos</h4>
    <p class="texto-normal">Fluxos e integrações que eliminam trabalho manual repetitivo.</p>
  </div>
  <div class="card card-azul">
    <h4 class="titulo-h4">Chatbots com IA</h4>
    <p class="texto-normal">Atendimento inteligente disponível o tempo todo.</p>
  </div>
  <div class="card card-laranja">
    <h4 class="titulo-h4">Consultoria em nuvem</h4>
    <p class="texto-normal">Arquitetura e migração com foco em custo e escala.</p>
  </div>
</div>
